name: Release Flow

on:
  release:
    types: [prereleased, released]

jobs:
  publish-packages:
    name: Push Packages
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: addnab/docker-run-action@v3
        with:
          image: valory/open-autonomy-user:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            set -eu
            echo "Pushing Packages"
            cd /work
            AUTHOR="$(python3 -c 'import json; dev = json.load(open("packages/packages.json"))["dev"]; print(next(iter(dev)).split("/")[1] if dev else "")')"
            if [ -z "$AUTHOR" ]; then
              echo "::error::could not determine the package author from packages/packages.json"
              exit 1
            fi
            autonomy init --reset --author "$AUTHOR" --ipfs --remote
            autonomy push-all
