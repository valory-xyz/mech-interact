[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project]
name = "mech-interact"
version = "0.1.0"
description = "Mech interaction skill for autonomous agents"
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "open-autonomy==0.21.31",
    "open-aea==2.2.10",
    "open-aea-ledger-ethereum==2.2.10",
    "open-aea-ledger-cosmos==2.2.10",
    "open-aea-cli-ipfs==2.2.10",
    "open-aea-test-autonomy==0.21.31",
    "open-aea-helpers==0.21.31",
    "requests>=2.28.1",
    "aiohttp<4.0.0,>=3.8.5",
    "asn1crypto<1.5.0,>=1.4.0",
    "grpcio==1.78.0",
    "jsonschema<5.0.0,>=4.23.0",
    "hypothesis>=6",
    "pytest>=8,<10",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7,<8",
    "pytest-randomly<5,>=4",
    "openapi-core<0.23,>=0.22",
    "openapi-spec-validator<0.8.0,>=0.7.0",
    "web3<8,>=7.0.0",
    "certifi>=2026.10.19",
    "multidict",
    "ecdsa>=0.15",
    "py-ecc<10,>=8",
    "click<9,>=8.1.0",
    "setuptools<=81.0.0",
    "marshmallow<4.0.0",
    "bases>=0.3,<0.4",
    "typing_validation<2,>=1.1",
    "pip>=24.0",
]

[project.urls]
Repository = "https://github.com/valory-xyz/mech-interact"

[dependency-groups]
dev = [
    "tomte[cli, tests]==0.7.4",
]

[tool.uv]
default-groups = "all"
prerelease = "allow"

[tool.tomte]
pytest_targets = [
    "packages/valory/skills/mech_interact_abci/tests",
    "packages/valory/contracts/mech/tests",
    "packages/valory/contracts/mech_mm/tests",
    "packages/valory/contracts/mech_marketplace_legacy/tests",
]
upstream_pins = [
    "valory-xyz/mech@v0.37.0-rc2",
]
tomte_dep_pin = "==0.7.4"
# filelock advisories in the safety scanner's own venv (safety requires
# filelock<4.0), on top of tomte's fleet list. None reach this package.
safety_ignores = [
    "SFTY-20261020-34461",
    "SFTY-20261020-18367",
    "SFTY-20261020-13394",
    "SFTY-20261020-91319",
    "SFTY-20261020-81101",
    "SFTY-20261020-25530",
    "SFTY-20261020-11422",
    "SFTY-20261023-10299",
    "SFTY-20261023-16869",
    "SFTY-20261023-24590",
]

[tool.uv.build-backend]
module-name = ["packages"]
module-root = ""
